
name: Update Telugu EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0,12 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download EPG tools
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git epg-tools
          cd epg-tools
          npm ci

      - name: Download Star Maa HD schedule
        run: |
          cat > epg-tools/starmaa.channels.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <channels>
            <channel site="dishtv.in" site_id="179620" lang="en" xmltv_id="StarMaa.in@HD">Star Maa HD</channel>
          </channels>
          EOF
          cd epg-tools
          npm run grab --- --channels=starmaa.channels.xml --output=guide.xml --days=2

      - name: Match playlist channel ID
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          tree = ET.parse("epg-tools/guide.xml")
          root = tree.getroot()

          programmes = root.findall(
              "./programme[@channel='StarMaa.in@HD']"
          )

          if not programmes:
              raise RuntimeError(
                  "No Star Maa HD programmes found. Existing EPG preserved."
              )

          for channel in root.findall("channel"):
              if channel.get("id") != "StarMaa.in@HD":
                  root.remove(channel)
              else:
                  channel.set("id", "373490")

          for programme in root.findall("programme"):
              if programme.get("channel") != "StarMaa.in@HD":
                  root.remove(programme)
              else:
                  programme.set("channel", "373490")

          tree.write(
              "epg.xml",
              encoding="utf-8",
              xml_declaration=True
          )

          print(f"Saved {len(programmes)} programmes")
          PY

      - name: Save updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          git diff --cached --quiet || git commit -m "Update Star Maa HD EPG"
          git push
